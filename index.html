<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio Inspiration Gallery</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #21252e;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #2a2e37;
    --accent: #7c9cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 56px 24px 32px;
    max-width: 760px;
    margin: 0 auto;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  header p {
    color: var(--muted);
    margin-top: 12px;
    font-size: 1rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px 80px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    background: var(--card-hover);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    border-color: var(--accent);
  }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #11141a
      repeating-linear-gradient(45deg, #14171e 0 10px, #11141a 10px 20px);
    overflow: hidden;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .thumb img.loaded { opacity: 1; }
  .thumb .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.5px;
  }
  .meta {
    text-align: center;
    padding: 18px 16px 22px;
  }
  .meta .num {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .meta h2 {
    font-size: 1.12rem;
    font-weight: 600;
  }
  .meta .domain {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 5px;
    word-break: break-all;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 0 24px 48px;
  }
</style>
</head>
<body>
  <header>
    <h1>Portfolio Inspiration for Beginners</h1>
    <p>8 hand-picked portfolio sites worth referencing · click any card to visit</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>Previews are auto-generated via WordPress mShots and may take a few seconds to load · click any card to visit the site</footer>

  <script>
    const sites = [
      { name: "Portfolio Reference", url: "https://portfolio-reference-zeta.vercel.app/" },
      { name: "Sitebuilder Report", url: "https://www.sitebuilderreport.com/free-portfolio-website-templates" },
      { name: "Portfolio Gallery", url: "https://www.portfoliogallery.dev/" },
      { name: "Dev Portfolios", url: "https://www.devportfolios.dev/" },
      { name: "Bruno Simon", url: "https://bruno-simon.com/" },
      { name: "Lapa Ninja", url: "https://www.lapa.ninja/category/portfolio/" },
      { name: "Webflow", url: "https://webflow.com/made-in-webflow/webflowportfolio" },
      { name: "Framer", url: "https://www.framer.com/marketplace/templates/category/portfolio/" }
    ];

    const grid = document.getElementById("grid");

    sites.forEach((site, i) => {
      const domain = new URL(site.url).hostname.replace(/^www\./, "");
      const shot = "https://s.wp.com/mshots/v1/" +
        encodeURIComponent(site.url) + "?w=640&h=400";

      const card = document.createElement("a");
      card.className = "card";
      card.href = site.url;
      card.innerHTML = `
        <div class="thumb">
          <span class="loading">Generating preview…</span>
          <img alt="${site.name} preview" loading="lazy" />
        </div>
        <div class="meta">
          <span class="num">${String(i + 1).padStart(2, "0")}</span>
          <h2>${site.name}</h2>
          <div class="domain">${domain}</div>
        </div>`;

      const img = card.querySelector("img");
      const loading = card.querySelector(".loading");

      img.addEventListener("load", () => {
        // mShots returns a small placeholder while generating; retry if too small.
        if (img.naturalWidth < 100) {
          setTimeout(() => { img.src = shot + "&t=" + Date.now(); }, 2500);
          return;
        }
        img.classList.add("loaded");
        loading.remove();
      });
      img.addEventListener("error", () => {
        loading.textContent = "Preview unavailable";
      });
      img.src = shot;

      grid.appendChild(card);
    });
  </script>

  <!-- Vercel Web Analytics (static-site version). Enable Analytics in the
       Vercel dashboard first; Vercel then serves this script automatically. -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
